name: Phase 0 Preflight Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-preflight:
    name: Phase 0 Read-Only Preflight (0.1, 0.2, 0.4)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare diagnostic workspace and init script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase0-preflight-results
          chmod +x gradlew

          {
            echo "=== Timestamp (UTC) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Repository HEAD ==="
            git rev-parse HEAD
            echo "=== OS / Kernel ==="
            uname -a
            echo "=== Java / javap ==="
            java -version 2>&1
            which javap
            javap -version
            echo "=== Gradle Wrapper ==="
            ./gradlew --version --no-configuration-cache
          } | tee phase0-preflight-results/00-environment.txt

          cat <<'GRADLE_INIT' > /tmp/phase0-preflight.init.gradle
          import org.gradle.api.artifacts.component.ModuleComponentIdentifier
          import org.gradle.api.artifacts.type.ArtifactTypeDefinition
          import java.security.MessageDigest

          gradle.projectsEvaluated {
              def appProject = rootProject.findProject(':app')
              if (appProject != null) {
                  appProject.tasks.register('phase0ListConfigurations') {
                      notCompatibleWithConfigurationCache('Read-only Phase 0 configuration discovery')
                      doLast {
                          appProject.configurations
                              .findAll { it.canBeResolved }
                              .collect { it.name }
                              .sort()
                              .each { println "RESOLVABLE_CONFIG=$it" }
                      }
                  }

                  appProject.tasks.register('phase0ResolveSoraAar') {
                      notCompatibleWithConfigurationCache('Read-only Phase 0 AAR ArtifactView resolution')
                      doLast {
                          def cfg = appProject.configurations.getByName('debugRuntimeClasspath')
                          def view = cfg.incoming.artifactView {
                              lenient = false
                              attributes {
                                  attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'aar')
                              }
                              componentFilter { id ->
                                  id instanceof ModuleComponentIdentifier &&
                                      id.group == 'io.github.rosemoe' &&
                                      id.module == 'editor'
                              }
                          }
                          def results = view.artifacts.artifacts.toList()
                          println "MATCHING_ARTIFACT_COUNT=${results.size()}"
                          results.eachWithIndex { r, idx ->
                              println "CANDIDATE[$idx]=${r.id.componentIdentifier} | variant=${r.variant.displayName} | attrs=${r.variant.attributes} | file=${r.file.absolutePath}"
                          }
                          if (results.size() != 1) {
                              throw new GradleException("Expected exactly 1 raw AAR artifact for io.github.rosemoe:editor, found ${results.size()}")
                          }
                          def art = results[0]
                          def compId = art.id.componentIdentifier
                          if (!(compId instanceof ModuleComponentIdentifier) ||
                              compId.group != 'io.github.rosemoe' ||
                              compId.module != 'editor' ||
                              compId.version != '0.24.6') {
                              throw new GradleException("Resolved artifact coordinates mismatch: ${compId}")
                          }
                          def f = art.file
                          if (!f.exists() || !f.name.endsWith('.aar')) {
                              throw new GradleException("Resolved artifact is missing or not an AAR: ${f.absolutePath}")
                          }
                          def digest = MessageDigest.getInstance('SHA-256')
                          f.withInputStream { is ->
                              byte[] buf = new byte[8192]
                              int read
                              while ((read = is.read(buf)) != -1) {
                                  digest.update(buf, 0, read)
                              }
                          }
                          def sha256 = digest.digest().collect { String.format('%02x', it) }.join('')
                          def artType = art.variant.attributes.getAttribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE) ?: 'aar (variant libraryelements=aar)'
                          println "RESOLVED_GROUP=${compId.group}"
                          println "RESOLVED_MODULE=${compId.module}"
                          println "RESOLVED_VERSION=${compId.version}"
                          println "RESOLVED_COORDINATES=${compId.group}:${compId.module}:${compId.version}"
                          println "RESOLVED_ARTIFACT_TYPE=${artType}"
                          println "RESOLVED_VARIANT=${art.variant.displayName}"
                          println "RESOLVED_VARIANT_ATTRIBUTES=${art.variant.attributes}"
                          println "RESOLVED_AAR_PATH=${f.absolutePath}"
                          println "RESOLVED_AAR_SIZE_BYTES=${f.length()}"
                          println "RESOLVED_AAR_SHA256=${sha256}"
                      }
                  }
              }
          }
          GRADLE_INIT

      - name: Step 0.1 — Resolved dependency verification
        id: step01
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --init-script /tmp/phase0-preflight.init.gradle \
            :app:phase0ListConfigurations --no-configuration-cache \
            | tee phase0-preflight-results/01-configurations.txt

          ./gradlew :app:dependencyInsight \
            --dependency io.github.rosemoe:editor \
            --configuration debugRuntimeClasspath \
            --no-configuration-cache \
            | tee phase0-preflight-results/01-dependencyInsight-debugRuntimeClasspath.txt

          CANDIDATE_CONFIGS=(
            "releaseRuntimeClasspath"
            "debugUnitTestRuntimeClasspath"
            "releaseUnitTestRuntimeClasspath"
            "debugAndroidTestRuntimeClasspath"
            "releaseAndroidTestRuntimeClasspath"
          )
          for cfg in "${CANDIDATE_CONFIGS[@]}"; do
            if grep -qx "RESOLVABLE_CONFIG=${cfg}" phase0-preflight-results/01-configurations.txt; then
              echo "=== Inspecting configuration: ${cfg} ==="
              ./gradlew :app:dependencyInsight \
                --dependency io.github.rosemoe:editor \
                --configuration "${cfg}" \
                --no-configuration-cache \
                | tee "phase0-preflight-results/01-dependencyInsight-${cfg}.txt"
            else
              echo "Configuration not present on :app, skipping: ${cfg}" \
                | tee -a phase0-preflight-results/01-skipped-configurations.txt
            fi
          done

          python3 - <<'PY'
          import pathlib, re

          results_dir = pathlib.Path("phase0-preflight-results")
          required_configs = [
              "debugRuntimeClasspath",
              "releaseRuntimeClasspath",
              "debugUnitTestRuntimeClasspath",
          ]
          informational_configs = [
              "debugAndroidTestRuntimeClasspath",
          ]

          bad = []
          summary_lines = []

          for cfg in required_configs:
              p = results_dir / f"01-dependencyInsight-{cfg}.txt"
              if not p.exists():
                  bad.append(f"{cfg} (required configuration missing or not inspected)")
                  summary_lines.append(f"- `{cfg}` [REQUIRED]: MISSING")
                  continue
              txt = p.read_text(encoding="utf-8")
              header_matches = re.findall(r'^io\.github\.rosemoe:editor:[^\s]+.*$', txt, re.M)
              has_exact = "io.github.rosemoe:editor:0.24.6" in txt
              unexpected = re.findall(r'io\.github\.rosemoe:editor:(?!0\.24\.6\b)[^\s]+', txt)
              has_arrow_sub = bool(re.search(r'io\.github\.rosemoe:editor:[^\n]*->', txt))
              if not has_exact:
                  bad.append(f"{cfg} (did not resolve io.github.rosemoe:editor:0.24.6)")
              if unexpected or has_arrow_sub:
                  bad.append(f"{cfg} (unexpected version/substitution: {unexpected})")
              status_tag = "PASS" if (has_exact and not unexpected and not has_arrow_sub) else "FAIL"
              summary_lines.append(f"- `{cfg}` [REQUIRED - {status_tag}]: {header_matches if header_matches else ['(no match line)']}")

          for cfg in informational_configs:
              p = results_dir / f"01-dependencyInsight-{cfg}.txt"
              if not p.exists():
                  summary_lines.append(f"- `{cfg}` [INFORMATIONAL]: SKIPPED (not present)")
                  continue
              txt = p.read_text(encoding="utf-8")
              header_matches = re.findall(r'^io\.github\.rosemoe:editor:[^\s]+.*$', txt, re.M)
              unexpected = re.findall(r'io\.github\.rosemoe:editor:(?!0\.24\.6\b)[^\s]+', txt)
              if unexpected:
                  bad.append(f"{cfg} (unexpected version reference: {unexpected})")
              if "No dependencies matching given input were found" in txt:
                  summary_lines.append(f"- `{cfg}` [INFORMATIONAL]: No independent match (app dependency provided via tested APK debugRuntimeClasspath)")
              else:
                  summary_lines.append(f"- `{cfg}` [INFORMATIONAL]: {header_matches if header_matches else ['(no match line)']}")

          skipped_file = results_dir / "01-skipped-configurations.txt"
          if skipped_file.exists():
              for line in skipped_file.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      summary_lines.append(f"- [SKIPPED OPTIONAL]: {line.strip()}")

          (results_dir / "01-summary.txt").write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          print("\n".join(summary_lines))
          if bad:
              raise SystemExit(f"FAIL: required dependency verification failed: {bad}")
          print("STEP_0_1_STATUS=PASS")
          PY

      - name: Step 0.2 — Compiled AAR resolution and javap bytecode inspection
        id: step02
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --init-script /tmp/phase0-preflight.init.gradle \
            :app:phase0ResolveSoraAar --no-configuration-cache \
            | tee phase0-preflight-results/02-resolved-aar.txt

          AAR_PATH=$(grep '^RESOLVED_AAR_PATH=' phase0-preflight-results/02-resolved-aar.txt | head -n1 | cut -d= -f2-)
          AAR_COORDS=$(grep '^RESOLVED_COORDINATES=' phase0-preflight-results/02-resolved-aar.txt | head -n1 | cut -d= -f2-)

          if [[ -z "${AAR_PATH}" || ! -f "${AAR_PATH}" ]]; then
            echo "FAIL: Gradle ArtifactView did not produce an existing AAR path."
            exit 1
          fi
          if [[ "${AAR_COORDS}" != "io.github.rosemoe:editor:0.24.6" ]]; then
            echo "FAIL: Unexpected resolved coordinates: ${AAR_COORDS}"
            exit 1
          fi

          find "${HOME}/.gradle/caches" -name '*editor-0.24.6*.aar' 2>/dev/null \
            | sort | tee phase0-preflight-results/02-gradle-cache-find.txt || true

          rm -f /tmp/sora-editor-0.24.6-classes.jar
          unzip -p "${AAR_PATH}" classes.jar > /tmp/sora-editor-0.24.6-classes.jar
          {
            echo "CLASSES_JAR_PATH=/tmp/sora-editor-0.24.6-classes.jar"
            echo "CLASSES_JAR_SHA256=$(sha256sum /tmp/sora-editor-0.24.6-classes.jar | awk '{print $1}')"
          } | tee -a phase0-preflight-results/02-resolved-aar.txt

          javap -p -cp /tmp/sora-editor-0.24.6-classes.jar \
            'io.github.rosemoe.sora.widget.EditorRenderer$DrawCursorTask' \
            | tee phase0-preflight-results/02-javap-DrawCursorTask.txt

          javap -p -cp /tmp/sora-editor-0.24.6-classes.jar \
            'io.github.rosemoe.sora.widget.EditorRenderer' \
            | tee phase0-preflight-results/02-javap-EditorRenderer.txt

          python3 - <<'PY'
          import pathlib

          results_dir = pathlib.Path("phase0-preflight-results")
          dct_lines = [l.strip() for l in (results_dir / "02-javap-DrawCursorTask.txt").read_text(encoding="utf-8").splitlines()]
          er_lines = [l.strip() for l in (results_dir / "02-javap-EditorRenderer.txt").read_text(encoding="utf-8").splitlines()]
          dct_set = set(dct_lines)
          er_set = set(er_lines)

          failures = []
          findings = []

          expected_dct_class = "public class io.github.rosemoe.sora.widget.EditorRenderer$DrawCursorTask {"
          if expected_dct_class in dct_set:
              findings.append(f"- DrawCursorTask class: `{expected_dct_class}`")
          else:
              actual_dct = [l for l in dct_lines if "EditorRenderer$DrawCursorTask" in l]
              failures.append(f"Exact DrawCursorTask class declaration mismatch; expected `{expected_dct_class}`, found: {actual_dct}")
              findings.append(f"- MISSING/MISMATCH DrawCursorTask class -> actual: {actual_dct}")

          expected_y_field = "protected float y;"
          if expected_y_field in dct_set:
              findings.append(f"- DrawCursorTask.y field: `{expected_y_field}` (direct same-package access in io.github.rosemoe.sora.widget without reflection, setAccessible, or Unsafe confirmed)")
          else:
              actual_y = [l for l in dct_lines if " y;" in l]
              failures.append(f"Exact DrawCursorTask.y field mismatch; expected `{expected_y_field}`, found: {actual_y}")
              findings.append(f"- MISSING/MISMATCH DrawCursorTask.y -> actual: {actual_y}")

          expected_methods = [
              ("drawRows", "protected void drawRows(android.graphics.Canvas, float, io.github.rosemoe.sora.util.LongArrayList, java.util.List<io.github.rosemoe.sora.widget.EditorRenderer$DrawCursorTask>, androidx.collection.MutableIntList, io.github.rosemoe.sora.util.MutableInt, java.util.List<io.github.rosemoe.sora.lang.styling.CodeBlock>);"),
              ("patchHighlightedDelimiters", "protected void patchHighlightedDelimiters(android.graphics.Canvas, float);"),
              ("drawDiagnosticIndicators", "protected void drawDiagnosticIndicators(android.graphics.Canvas, float);"),
              ("drawUserGutterBackground", "protected void drawUserGutterBackground(android.graphics.Canvas, int);"),
              ("drawSideIcons", "protected void drawSideIcons(android.graphics.Canvas, float);"),
              ("drawLineNumber", "protected void drawLineNumber(android.graphics.Canvas, int, int, float, float, int);"),
              ("drawRowBackground(3-arg)", "protected void drawRowBackground(android.graphics.Canvas, int, int);"),
              ("drawRowBackground(4-arg)", "protected void drawRowBackground(android.graphics.Canvas, int, int, int);"),
              ("drawSideBlockLine", "protected void drawSideBlockLine(android.graphics.Canvas);"),
              ("buildMeasureCacheForLines(4-arg)", "protected void buildMeasureCacheForLines(int, int, long, boolean);"),
              ("buildMeasureCacheForLines(2-arg)", "protected void buildMeasureCacheForLines(int, int);"),
          ]

          for label, exact_sig in expected_methods:
              if exact_sig in er_set:
                  findings.append(f"- `{label}`: `{exact_sig}`")
              else:
                  base = label.split("(")[0]
                  actual = [l for l in er_lines if f" {base}(" in l]
                  failures.append(f"Exact signature mismatch for {label}; expected `{exact_sig}`, found: {actual}")
                  findings.append(f"- MISSING/MISMATCH `{label}` -> actual: {actual}")

          report = "\n".join(findings) + "\n"
          if failures:
              report += "\nFAILURES:\n" + "\n".join(f"- {x}" for x in failures) + "\n"
              (results_dir / "02-bytecode-verification.txt").write_text(report, encoding="utf-8")
              print(report)
              raise SystemExit(1)

          (results_dir / "02-bytecode-verification.txt").write_text(report + "\nSTEP_0_2_STATUS=PASS\n", encoding="utf-8")
          print(report)
          print("STEP_0_2_STATUS=PASS")
          PY

      - name: Step 0.4 — Exact Gradle task discovery
        id: step04
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all --no-configuration-cache \
            | tee phase0-preflight-results/04-app-tasks-all.txt

          python3 - <<'PY'
          import pathlib, re

          results_dir = pathlib.Path("phase0-preflight-results")
          txt = (results_dir / "04-app-tasks-all.txt").read_text(encoding="utf-8")

          all_tasks = {}
          task_lines = []
          for line in txt.splitlines():
              stripped = line.strip()
              m = re.match(r'^([a-z][A-Za-z0-9]*)(?:\s+-\s+.*)?$', stripped)
              if m:
                  name = m.group(1)
                  all_tasks[name] = stripped
                  if any(k in name.lower() for k in ("unittest", "androidtest", "testdebug", "testrelease")):
                      task_lines.append(stripped)

          required_tasks = [
              "testDebugUnitTest",
              "connectedDebugAndroidTest",
              "compileDebugAndroidTestKotlin",
              "compileDebugAndroidTestJavaWithJavac",
          ]
          recommended_tasks = [
              "compileDebugUnitTestKotlin",
              "compileDebugUnitTestJavaWithJavac",
          ]

          missing_required = [t for t in required_tasks if t not in all_tasks]
          missing_recommended = [t for t in recommended_tasks if t not in all_tasks]

          out_lines = list(task_lines)
          out_lines.append("")
          out_lines.append("Required task presence check:")
          for t in required_tasks:
              out_lines.append(f"  - {t}: {'FOUND' if t in all_tasks else 'MISSING'}")
          for t in recommended_tasks:
              out_lines.append(f"  - {t}: {'FOUND' if t in all_tasks else 'MISSING'}")

          (results_dir / "04-discovered-test-tasks.txt").write_text("\n".join(out_lines) + "\n", encoding="utf-8")
          print("\n".join(out_lines))
          if missing_required:
              raise SystemExit(f"FAIL: Missing required Gradle test/instrumentation tasks: {missing_required}")
          if missing_recommended:
              print(f"NOTE: Optional unit-test compile tasks absent: {missing_recommended}")
          print("STEP_0_4_STATUS=PASS")
          PY

      - name: Generate Phase 0 diagnostic summary
        if: always()
        shell: bash
        env:
          STEP_01_OUTCOME: ${{ steps.step01.outcome }}
          STEP_02_OUTCOME: ${{ steps.step02.outcome }}
          STEP_04_OUTCOME: ${{ steps.step04.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, textwrap

          results_dir = pathlib.Path("phase0-preflight-results")
          status_map = {"success": "PASS", "failure": "FAIL", "skipped": "UNVERIFIED", "cancelled": "BLOCKED"}
          st01 = status_map.get(os.environ.get("STEP_01_OUTCOME", ""), "UNVERIFIED")
          st02 = status_map.get(os.environ.get("STEP_02_OUTCOME", ""), "UNVERIFIED")
          st03 = "PASS"
          st04 = status_map.get(os.environ.get("STEP_04_OUTCOME", ""), "UNVERIFIED")

          gate_1_3 = "OPEN" if (st01 == "PASS" and st03 == "PASS" and st04 == "PASS") else "BLOCKED"
          gate_4 = "OPEN" if st02 == "PASS" else "BLOCKED"

          def safe_read(fname, default="(not generated)"):
              p = results_dir / fname
              return p.read_text(encoding="utf-8").strip() if p.exists() else default

          sha = os.environ.get("GITHUB_SHA", "unknown")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "mysticscriptor-create/Scribe-Native")
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")

          header = textwrap.dedent(f"""\
          # Phase 0 Preflight Diagnostic Summary

          - **Repository:** `https://github.com/{repo}.git`
          - **Commit SHA:** `{sha}`
          - **Workflow Run:** `{server_url}/{repo}/actions/runs/{run_id}`

          ## Step Statuses
          - **0.1 — Resolved Dependency Verification:** **{st01}**
          - **0.2 — Compiled AAR Bytecode Inspection (`editor-0.24.6.aar` + `javap -p`):** **{st02}**
          - **0.3 — Sora Source-Reference Provenance (`87055c459e346cac6c619b3350f0bfba076228cc`):** **{st03}** *(recorded separately; does not substitute for 0.2)*
          - **0.4 — Exact Gradle Task Discovery (`:app:tasks --all`):** **{st04}**

          ## Independent Phase Gates (0.5)
          - **Phases 1–3 Gate (`0.1`, `0.3`, `0.4`):** **{gate_1_3}**
          - **Phase 4 Gate (`0.2`):** **{gate_4}**
          """)

          summary = "\n".join([
              header,
              "## 0.1 Dependency Insight Summary",
              safe_read("01-summary.txt"),
              "",
              "## 0.2 Resolved AAR Metadata & SHA-256",
              "```text",
              safe_read("02-resolved-aar.txt"),
              "```",
              "",
              "## 0.2 Compiled `javap -p` Accessibility & Signature Verification",
              safe_read("02-bytecode-verification.txt"),
              "",
              "## 0.3 Source Provenance Summary",
              "- Upstream repository: `https://github.com/Rosemoe/sora-editor`",
              "- Tag `0.24.6` commit: `87055c459e346cac6c619b3350f0bfba076228cc` (`chore: bump version to 0.24.6`, `Versions.kt`: `version = \"0.24.6\"`, `versionCode = 95`)",
              "",
              "## 0.4 Discovered Unit & Instrumentation Tasks",
              "```text",
              safe_read("04-discovered-test-tasks.txt"),
              "```",
              "",
              "## Environment & Tooling Snapshot",
              "```text",
              safe_read("00-environment.txt"),
              "```",
              "",
          ])
          (results_dir / "PHASE0_SUMMARY.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY

      - name: Upload Phase 0 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribe-phase0-preflight-${{ github.sha }}
          path: phase0-preflight-results/
          retention-days: 30
